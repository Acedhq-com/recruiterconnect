name: Discovery reference contract (not production)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discovery-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-contract:
    name: Reference harness / Python ${{ matrix.python }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            node: "22"
          - python: "3.14"
            node: "24"
    env:
      DISCOVERY_REQUIRE_PRODUCTION: "0"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          npm ci
      - name: Verify both suites, coverage, parity, and fresh CI reports
        run: python -m scripts.run_ci
      - name: Upload diagnostic reports, including on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: discovery-reference-py${{ matrix.python }}-node${{ matrix.node }}
          path: reports/
          if-no-files-found: error
          retention-days: 14
