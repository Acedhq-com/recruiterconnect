name: Discovery reference contract (not production)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discovery-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-contract:
    name: Reference harness / Python ${{ matrix.python }} / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            node: "22"
          - python: "3.14"
            node: "24"
    env:
      DISCOVERY_REQUIRE_PRODUCTION: "0"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          npm ci
      - name: Verify both suites, coverage, parity, and fresh CI reports
        run: python -m scripts.run_ci
      - name: Upload diagnostic reports, including on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: discovery-reference-py${{ matrix.python }}-node${{ matrix.node }}
          path: reports/
          if-no-files-found: error
          retention-days: 14
