name: Private account database security (synthetic auth)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-security:
    name: PostgreSQL lifecycle / RLS / validation regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: recruiterconnect_audit
          POSTGRES_USER: postgres
          # Disposable container only, never a production credential.
          POSTGRES_PASSWORD: audit-ci-only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recruiterconnect_audit"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUDIT_DATABASE_URL: dbname=recruiterconnect_audit
      PGHOST: 127.0.0.1
      PGPORT: "5433"
      PGUSER: postgres
      PGPASSWORD: audit-ci-only
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Apply forward migrations and enforce SQL security regressions
        run: python -m scripts.run_database_tests
      - name: Upload database evidence, including on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: private-database-security
          path: reports/
          if-no-files-found: error
          retention-days: 14
